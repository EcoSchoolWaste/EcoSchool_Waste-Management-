<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#052c24"/><stop offset=".48" stop-color="#087347"/><stop offset="1" stop-color="#021d20"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#d7ff9b" stop-opacity=".75"/><stop offset="1" stop-color="#7cff55" stop-opacity="0"/></radialGradient>
  <radialGradient id="earth"><stop stop-color="#5dd7ff"/><stop offset=".62" stop-color="#0877bd"/><stop offset="1" stop-color="#032e5c"/></radialGradient>
  <linearGradient id="land" x2="1" y2="1"><stop stop-color="#c7f57a"/><stop offset=".5" stop-color="#329e55"/><stop offset="1" stop-color="#0b583d"/></linearGradient>
  <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#3fbf68"/><stop offset="1" stop-color="#063c2b"/></linearGradient>
  <linearGradient id="bin" x2="0" y2="1"><stop stop-color="#31d66a"/><stop offset="1" stop-color="#05663e"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="320" cy="180" r="330" fill="url(#sun)"/>
<circle cx="1320" cy="200" r="400" fill="url(#sun)" opacity=".65"/>
